<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Such is Life - The Kelly Gang</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤠</text></svg>">
</head>
<body>
    <div id="loading-screen" class="active">
        <div class="spinner"></div>
        <p>Loading Game...</p>
    </div>

    <div id="game-container">
        <div id="top-bar">
            <h1>Such is Life: The Kelly Gang</h1>
            <div id="game-status">Connecting...</div>
        </div>

        <div id="menu-area">
            <section id="main-menu-section" class="menu-section active">
                <h2>Main Menu</h2>
                <button id="singlePlayerBtn" class="button-primary">Single Player</button>
                <button id="multiplayerBtn" class="button-primary">Multiplayer</button>
            </section>

            <section id="multiplayer-menu-section" class="menu-section">
                <h2>Multiplayer</h2>
                <p>Host a new game:</p>
                <div class="button-group">
                    <button id="hostGameBtn2" class="button-secondary" data-players="2">2 Players</button>
                    <button id="hostGameBtn3" class="button-secondary" data-players="3">3 Players</button>
                    <button id="hostGameBtn4" class="button-secondary" data-players="4">4 Players</button>
                </div>
                <hr>
                <p>Or join an existing game:</p>
                <button id="showJoinUIBtn" class="button-secondary">Join Game</button>
                <button class="button-back" data-target="main-menu-section">Back to Main Menu</button>
            </section>

            <section id="host-wait-section" class="menu-section">
                <h2>Hosting Game</h2>
                <p>Game ID: <strong id="game-code-display">------</strong></p>
                <p id="waiting-message">Waiting for players...</p>
                <button id="cancelHostBtn" class="button-danger">Cancel Game</button>
            </section>

            <section id="join-code-section" class="menu-section">
                <h2>Join Game</h2>
                <input type="text" id="gameIdInput" placeholder="Enter Game ID (6 chars)" maxlength="6">
                <button id="joinGameSubmitBtn" class="button-primary">Join</button>
                <button class="button-back" data-target="multiplayer-menu-section">Back to Multiplayer</button>
            </section>
        </div>

        <div id="game-area">
            <div id="stats-panel">
                <div id="player-stats-grid">
                </div>
                <div id="environment-info">
                    <span id="day-night-indicator">Day</span> | <span id="temperature-indicator">20°C</span>
                </div>
                <div class="game-controls">
                    <button id="muteBtn" aria-pressed="false">Mute</button>
                    <button id="leaveGameBtn" class="button-danger">Leave Game</button>
                </div>
            </div>

            <div id="canvas-container">
            </div>
            <div id="countdown-overlay"></div>
        </div>

        <div id="chat-panel">
            <div id="chat-log"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Type message...">
                <button id="sendChatBtn">Send</button>
            </div>
        </div>

        <div id="game-over-screen" class="overlay-screen">
            <div class="overlay-content">
                <h2>Game Over!</h2>
                <div id="final-stats">
                </div>
                <button id="gameOverBackBtn" class="button-primary">Back to Menu</button>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
